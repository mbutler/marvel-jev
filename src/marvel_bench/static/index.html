<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marvel Matchup Bench</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a1512;
      --paper: #f3ebe0;
      --panel: #fff8ef;
      --line: #c9b8a4;
      --accent: #c0392b;
      --muted: #6b5c4d;
      --ok: #1f6b4a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, #ffe7c8 0%, transparent 40%),
        linear-gradient(180deg, #efe4d4 0%, var(--paper) 40%);
      min-height: 100vh;
    }
    header {
      padding: 2rem 1.5rem 1rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 {
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(2.5rem, 6vw, 4rem);
      letter-spacing: 0.04em;
      margin: 0;
      line-height: 0.95;
    }
    .sub {
      color: var(--muted);
      max-width: 40rem;
      margin-top: 0.6rem;
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem 3rem;
      display: grid;
      gap: 1.25rem;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.75rem;
    }
    .stat, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 1rem 1.1rem;
    }
    .stat .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .stat .value {
      font-family: "Bebas Neue", sans-serif;
      font-size: 2rem;
      margin-top: 0.2rem;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 1.25rem;
    }
    @media (max-width: 860px) {
      .row { grid-template-columns: 1fr; }
    }
    h2 {
      font-family: "Bebas Neue", sans-serif;
      letter-spacing: 0.05em;
      font-size: 1.6rem;
      margin: 0 0 0.8rem;
    }
    select, input[type="search"] {
      font: inherit;
      border: 1px solid var(--line);
      background: #fff;
      padding: 0.45rem 0.6rem;
      border-radius: 2px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.8rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }
    th, td {
      text-align: left;
      padding: 0.45rem 0.35rem;
      border-bottom: 1px solid var(--line);
    }
    th { color: var(--muted); font-weight: 500; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; }
    .fight {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0.6rem;
      align-items: center;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--line);
    }
    .fight .name { font-weight: 600; }
    .fight .vs {
      font-family: "Bebas Neue", sans-serif;
      color: var(--accent);
      font-size: 1.2rem;
    }
    .winner { color: var(--ok); }
    .muted { color: var(--muted); font-size: 0.85rem; }
    .error { color: var(--accent); padding: 1rem; }
    .empty { color: var(--muted); padding: 0.5rem 0; }
  </style>
</head>
<body>
  <header>
    <h1>Marvel Matchup Bench</h1>
    <p class="sub">
      Pairwise fair-fight decisions from OpenRouter Jev and/or local SemIf.
    </p>
  </header>
  <main>
    <section class="stats" id="stats"></section>
    <section class="row">
      <div class="panel">
        <h2>Leaderboard</h2>
        <div class="controls">
          <label>
            Backend
            <select id="backendSelect"></select>
          </label>
        </div>
        <div id="leaderboard"><p class="empty">Loading…</p></div>
      </div>
      <div class="panel">
        <h2>Recent fights</h2>
        <div class="controls">
          <input id="search" type="search" placeholder="Filter by name…" />
        </div>
        <div id="fights"><p class="empty">Loading…</p></div>
      </div>
    </section>
  </main>
  <script>
    const state = { report: null, leaderboard: null, results: [], backend: null };

    async function load() {
      try {
        const [report, leaderboard, results] = await Promise.all([
          fetch("/api/report").then(r => r.json()),
          fetch("/api/leaderboard").then(r => r.json()),
          fetch("/api/results").then(r => r.json()),
        ]);
        if (report.error) throw new Error(report.error);
        state.report = report;
        state.leaderboard = leaderboard;
        state.results = Array.isArray(results) ? results.slice().reverse() : [];
        const backends = Object.keys(report.backends || {});
        state.backend = backends[0] || null;
        renderStats();
        fillBackendSelect(backends);
        renderLeaderboard();
        renderFights();
      } catch (err) {
        document.getElementById("stats").innerHTML =
          `<div class="error">${err.message}<br/><span class="muted">Run generate → score → report first.</span></div>`;
        document.getElementById("leaderboard").innerHTML = "";
        document.getElementById("fights").innerHTML = "";
      }
    }

    function renderStats() {
      const backends = state.report.backends || {};
      const cards = [];
      for (const [name, b] of Object.entries(backends)) {
        cards.push(stat(name.toUpperCase() + " OK", b.ok));
        cards.push(stat(name.toUpperCase() + " /s", b.fights_per_sec_est ?? "—"));
        if (name === "openrouter") cards.push(stat("SPEND", `$${(b.total_cost || 0).toFixed(4)}`));
        cards.push(stat(name.toUpperCase() + " ms", b.mean_latency_ms ?? "—"));
      }
      document.getElementById("stats").innerHTML = cards.join("") || `<div class="empty">No backends yet.</div>`;
    }

    function stat(label, value) {
      return `<div class="stat"><div class="label">${label}</div><div class="value">${value}</div></div>`;
    }

    function fillBackendSelect(backends) {
      const sel = document.getElementById("backendSelect");
      sel.innerHTML = backends.map(b => `<option value="${b}">${b}</option>`).join("");
      sel.onchange = () => { state.backend = sel.value; renderLeaderboard(); };
    }

    function renderLeaderboard() {
      const rows = (state.leaderboard?.by_backend?.[state.backend]) || [];
      if (!rows.length) {
        document.getElementById("leaderboard").innerHTML = `<p class="empty">No standings.</p>`;
        return;
      }
      const body = rows.map((r, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${escapeHtml(r.name)}</td>
          <td>${r.wins}-${r.losses}</td>
          <td>${(r.win_rate * 100).toFixed(0)}%</td>
        </tr>`).join("");
      document.getElementById("leaderboard").innerHTML = `
        <table>
          <thead><tr><th>#</th><th>Character</th><th>W-L</th><th>Win%</th></tr></thead>
          <tbody>${body}</tbody>
        </table>`;
    }

    function renderFights() {
      const q = (document.getElementById("search").value || "").toLowerCase();
      const rows = state.results.filter(r => {
        if (r.error) return !q || (r.a_name + r.b_name).toLowerCase().includes(q);
        const hay = `${r.a_name} ${r.b_name} ${r.winner_name || ""} ${r.backend || ""}`.toLowerCase();
        return !q || hay.includes(q);
      }).slice(0, 80);

      if (!rows.length) {
        document.getElementById("fights").innerHTML = `<p class="empty">No fights yet.</p>`;
        return;
      }

      document.getElementById("fights").innerHTML = rows.map(r => {
        if (r.error) {
          return `<div class="fight">
            <div><div class="name">${escapeHtml(r.a_name)}</div></div>
            <div class="vs">ERR</div>
            <div><div class="name">${escapeHtml(r.b_name)}</div>
            <div class="muted">${escapeHtml(r.error)}</div></div>
          </div>`;
        }
        const aWin = r.choice === "a";
        const bWin = r.choice === "b";
        const pa = r.probabilities?.a;
        const pb = r.probabilities?.b;
        return `<div class="fight">
          <div>
            <div class="name ${aWin ? "winner" : ""}">${escapeHtml(r.a_name)}</div>
            <div class="muted">${pa != null ? (pa * 100).toFixed(1) + "%" : ""}</div>
          </div>
          <div class="vs">VS</div>
          <div>
            <div class="name ${bWin ? "winner" : ""}">${escapeHtml(r.b_name)}</div>
            <div class="muted">${pb != null ? (pb * 100).toFixed(1) + "%" : ""} · ${escapeHtml(r.backend || "")}${r.latency_ms != null ? " · " + Math.round(r.latency_ms) + "ms" : ""}</div>
          </div>
        </div>`;
      }).join("");
    }

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[c]);
    }

    document.getElementById("search").addEventListener("input", renderFights);
    load();
  </script>
</body>
</html>
